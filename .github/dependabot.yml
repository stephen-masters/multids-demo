# Dependabot keeps the Maven dependencies, the Maven wrapper and the workflow
# actions current. Commit-message prefixes are set so its PRs satisfy the
# Conventional Commits hook that local commits go through (Dependabot commits
# on GitHub's side bypass it).
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
